<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}"
  dir="{{ or site.Language.LanguageDirection `ltr` }}">

  <head>
    {{ partial "head.html" . }}
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="page {{ block "page_class" . }}{{ end }}">
      <header>
        {{ partial "header.html" . }}
      </header>

      <main id="main" class="main {{ block "main_class" . }}{{ end }}">
        {{ block "main" . }}{{ end }}
      </main>
    </div>

    <footer>
      {{ partial "footer.html" . }}
    </footer>

    {{ if .Param "math" }}
    {{ partialCached "math.html" . }}
    {{ end }}

    {{ if and hugo.IsProduction site.Params.simpleAnalytics.enable }}
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    {{ end }}
  </body>

</html>
