{{ if or .NextInSection .PrevInSection }}
<nav class="post-nav" aria-label="Adjacent pages">
  {{ with .NextInSection }}
  <a class="post-nav-newer" href="{{ .RelPermalink }}"><span aria-hidden="true">←</span> {{ .Title }}</a>
  {{ else }}<span></span>{{ end }}
  {{ with .PrevInSection }}
  <a class="post-nav-older" href="{{ .RelPermalink }}">{{ .Title }} <span aria-hidden="true">→</span></a>
  {{ end }}
</nav>
{{ end }}
