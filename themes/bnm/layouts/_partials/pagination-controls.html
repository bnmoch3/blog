{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{ if .HasPrev }}<a rel="prev" href="{{ .Prev.URL | absURL }}">Previous</a>{{ else }}<span></span>{{ end }}
  <span class="page-number">Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  {{ if .HasNext }}<a rel="next" href="{{ .Next.URL | absURL }}">Next</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
