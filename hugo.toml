baseURL = 'https://bnmoch3.org'
languageCode = 'en-us'
title = 'bnmoch3'
theme = 'bnm'
summaryLength = 0
publishDir = "build/main"

# Hugo version: 0.148.x. The standard (non-extended) edition is enough; the
# theme uses no Sass/PostCSS. The theme's hugo.toml enforces min = 0.148.0.

[taxonomies]
tag = 'tags'

[permalinks]
posts = "/p/:slug"
notes = "/notes/:year/:slug"

[params]
description = "A tech-oriented personal blog"

hideHeader = false

# Intro on main page, content in markdown
# homeIntroTitle = 'Hi!'
homeIntroContent = "Enjoyer of Go, Rust, Python, Databases & SQL"

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '2006 Jan 02'
listDateFormatInYear = 'Jan 02' # lists grouped under a year heading

# Breadcrumbs
breadcrumbs = true

showFooter = true
footerContent = ""

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "about"
url = "/about"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "notes"
url = "/notes"

[[params.menu]]
name = "tags"
url = "/tags"


# Syntax highligth on code blocks
[markup]
[markup.highlight]
# class-based output; colors live in themes/bnm/assets/css/code.css
noClasses = false
lineNos = false
guessSyntax = false

# Curly quotes, apostrophes, en/em dashes and ellipses from plain Markdown.
# Hugo enables this by default; stated here so it stays on. Code is not touched.
[markup.goldmark.extensions.typographer]
disable = false

# Deploy settings

[[deployment.matchers]]
pattern = "^.+\\.(js|css|svg|ttf|woff2)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(png|jpg|gif|webp)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = false

[params.giscus]
enable = true
repo = "bnmoch3/blog"
repoid = "R_kgDOIU86DQ"
category = "General"
categoryid = "DIC_kwDOIU86Dc4Clvgl"
mapping = "pathname"
# Absolute URL of the CSS giscus loads into its iframe (served from themes/bnm/static/giscus/bnm-3.css).
# It exists only after a deploy; set to "noborder_light" (or any built-in) while testing.
theme = "https://bnmoch3.org/giscus/bnm-3.css"

# Home page: number of newest posts and notes under "Latest"
[params.home]
latestPosts = 3
latestNotes = 5

# Analytics (loaded in production builds only)
[params.simpleAnalytics]
enable = true

# Fonts: change a font by editing family/fallback/files here and dropping the
# WOFF2 files into themes/bnm/static/fonts/<dir>/ (or the site's static/fonts/<dir>/).
# @font-face rules and --font-heading / --font-body / --font-mono are generated from this.
[params.fonts.heading]
family = "Hanken Grotesk"
dir = "hanken-grotesk"
fallback = "ui-sans-serif, system-ui, sans-serif"
[[params.fonts.heading.files]]
file = "hanken-grotesk-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"
preload = true
# Previous heading font (files kept in themes/bnm/static/fonts/outfit/):
# family = "Outfit"
# dir = "outfit"
# file = "outfit-latin-wght-normal.woff2"

# Body font. size, leading and measure are per font because the same size looks different in
# different faces. measure is the article column width.
[params.fonts.body]
family = "Source Serif 4"
dir = "source-serif-4"
fallback = "Georgia, ui-serif, serif"
size = "1.125rem"
leading = 1.45
measure = "33em"
[[params.fonts.body.files]]
file = "source-serif-4-latin-wght-normal.woff2"
weight = "200 900"
style = "normal"
preload = true
[[params.fonts.body.files]]
file = "source-serif-4-latin-wght-italic.woff2"
weight = "200 900"
style = "italic"

[params.fonts.mono]
family = "Google Sans Code"
dir = "google-sans-code"
fallback = "ui-monospace, Menlo, Consolas, monospace"
[[params.fonts.mono.files]]
file = "google-sans-code-latin-wght-normal.woff2"
weight = "300 800"
style = "normal"
[[params.fonts.mono.files]]
file = "google-sans-code-latin-wght-italic.woff2"
weight = "300 800"
style = "italic"
